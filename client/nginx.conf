server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — long cache, filenames are content-hashed by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: any path that isn't a real file falls back to
    # index.html so client-side routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the server container — "server" resolves via
    # Docker's internal DNS, same service-discovery pattern used
    # throughout this project (MONGODB_URI, REDIS_URL, the dev Vite proxy).
    location /api/ {
        proxy_pass http://server:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
