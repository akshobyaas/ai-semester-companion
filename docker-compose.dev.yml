version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: asc-mongo-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - asc-network

  redis:
    image: redis:7-alpine
    container_name: asc-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - asc-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: asc-server-dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Overrides .env: inside the Docker network, "mongo"/"redis" are the
      # hostnames, not localhost — this is the service-discovery talking point.
      - MONGODB_URI=mongodb://mongo:27017/learningagent
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
      - redis
    networks:
      - asc-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: asc-client-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - server
    networks:
      - asc-network

networks:
  asc-network:
    driver: bridge

volumes:
  mongo_data:
